# Production deployment to GitHub Pages.
#
# How publishing works
# --------------------
# The `gh-pages` branch is the single source of truth for what GitHub Pages
# serves. Its root holds the production build of `main`, and
# `pr-preview/pr-<number>/` sub-folders hold live previews of open pull
# requests (see pr-preview.yml).
#
#   push to main ──► build ──► write dist/ to gh-pages root ──► publish gh-pages
#   PR preview   ──► (pr-preview.yml writes its folder) ──► dispatches this
#                    workflow with publish_only=true ──► publish gh-pages
#
# The publish job always runs on the `main` ref, which is the only branch the
# `github-pages` environment allows to deploy.
name: Deploy Astro site to Pages

on:
    push:
        branches: ["main"]

    workflow_dispatch:
        inputs:
            publish_only:
                description: "Skip the build and just publish the current gh-pages branch"
                type: boolean
                default: false

permissions:
    contents: write # push the built site to the gh-pages branch
    pages: write
    id-token: write

# Serialise everything that touches gh-pages or the Pages deployment.
concurrency:
    group: "pages"
    cancel-in-progress: false

jobs:
    build:
        name: Build
        if: ${{ github.event_name == 'push' || !inputs.publish_only }}
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: lts/*
                  cache: npm

            - name: Setup Pages
              id: pages
              uses: actions/configure-pages@v5

            - name: Install dependencies
              run: npm ci

            - name: Build with Astro
              run: |
                  npx --no-install astro build \
                    --site "${{ steps.pages.outputs.origin }}" \
                    --base "${{ steps.pages.outputs.base_path }}"

            - name: Write production build to gh-pages root
              uses: JamesIves/github-pages-deploy-action@v4
              with:
                  branch: gh-pages
                  folder: dist
                  clean: true
                  clean-exclude: pr-preview
                  force: false
                  commit-message: "Production build of ${{ github.sha }}"

    publish:
        name: Publish
        needs: build
        # Run after a successful build, or straight away when the build was
        # skipped because publish_only was requested.
        if: ${{ !cancelled() && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Checkout gh-pages
              uses: actions/checkout@v4
              with:
                  ref: gh-pages

            - name: Upload Pages artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  path: .

            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
