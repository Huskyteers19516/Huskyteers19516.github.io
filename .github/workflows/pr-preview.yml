# Pull request previews.
#
# For every pull request targeting `main` this workflow:
#   1. builds the site with the base path `/pr-preview/pr-<number>/`,
#   2. writes the build into that folder on the `gh-pages` branch,
#   3. asks the deploy workflow (astro.yml) to publish gh-pages, and
#   4. leaves a sticky comment on the PR with the preview link.
#
# When the PR is closed or merged the preview folder is removed again.
#
# Previews are only produced for branches inside this repository. Pull
# requests from forks get a read-only token and cannot write to gh-pages.
name: PR preview

on:
    pull_request:
        branches: ["main"]
        types: [opened, synchronize, reopened, closed]

permissions:
    contents: write # push to gh-pages
    pull-requests: write # sticky comment
    actions: write # dispatch the deploy workflow

# One preview job per PR at a time; newer pushes replace queued ones.
concurrency:
    group: pr-preview-${{ github.event.pull_request.number }}
    cancel-in-progress: true

env:
    PREVIEW_DIR: pr-preview/pr-${{ github.event.pull_request.number }}
    PREVIEW_URL: https://${{ github.repository_owner }}.github.io/pr-preview/pr-${{ github.event.pull_request.number }}/

jobs:
    build-preview:
        name: Build and publish preview
        if: ${{ github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository }}
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: lts/*
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Build with Astro
              run: |
                  npx --no-install astro build \
                    --site "https://${{ github.repository_owner }}.github.io" \
                    --base "/${{ env.PREVIEW_DIR }}/"

            - name: Write preview to gh-pages
              uses: JamesIves/github-pages-deploy-action@v4
              with:
                  branch: gh-pages
                  folder: dist
                  target-folder: ${{ env.PREVIEW_DIR }}
                  clean: true
                  force: false
                  commit-message: "Preview of PR #${{ github.event.pull_request.number }} at ${{ github.event.pull_request.head.sha }}"

            - name: Publish gh-pages
              id: publish
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  if gh workflow run astro.yml --ref main -f publish_only=true; then
                    echo "dispatched=true" >> "$GITHUB_OUTPUT"
                  else
                    echo "dispatched=false" >> "$GITHUB_OUTPUT"
                    echo "::warning::Could not dispatch the deploy workflow. The preview is on gh-pages but will not be live until astro.yml on main accepts the publish_only input."
                  fi

            - name: Comment preview link
              uses: actions/github-script@v7
              env:
                  DISPATCHED: ${{ steps.publish.outputs.dispatched }}
              with:
                  script: |
                      const marker = '<!-- pr-preview-comment -->';
                      const url = process.env.PREVIEW_URL;
                      const sha = context.payload.pull_request.head.sha.slice(0, 7);
                      const live = process.env.DISPATCHED === 'true';
                      const body = [
                        marker,
                        '### Site preview',
                        '',
                        live
                          ? `A preview of commit \`${sha}\` is being published to ${url}`
                          : `A preview of commit \`${sha}\` was built, but it could not be published automatically. It will appear at ${url} once the deploy workflow on \`main\` supports publish-only runs.`,
                        '',
                        'Publishing takes about a minute after this comment appears. The preview updates on every push and is removed when the pull request is closed.',
                      ].join('\n');

                      const { owner, repo } = context.repo;
                      const issue_number = context.payload.pull_request.number;
                      const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
                      const existing = comments.find(c => c.body && c.body.includes(marker));
                      if (existing) {
                        await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
                      } else {
                        await github.rest.issues.createComment({ owner, repo, issue_number, body });
                      }

    remove-preview:
        name: Remove preview
        if: ${{ github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository }}
        runs-on: ubuntu-latest
        steps:
            - name: Checkout gh-pages
              id: checkout
              uses: actions/checkout@v4
              continue-on-error: true # gh-pages may not exist yet
              with:
                  ref: gh-pages

            - name: Delete preview folder
              id: delete
              if: ${{ steps.checkout.outcome == 'success' }}
              run: |
                  if [ -d "$PREVIEW_DIR" ]; then
                    git config user.name "github-actions[bot]"
                    git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                    git rm -r -q "$PREVIEW_DIR"
                    git commit -q -m "Remove preview of PR #${{ github.event.pull_request.number }}"
                    git push
                    echo "removed=true" >> "$GITHUB_OUTPUT"
                  else
                    echo "No preview folder to remove."
                    echo "removed=false" >> "$GITHUB_OUTPUT"
                  fi

            - name: Publish gh-pages
              if: ${{ steps.delete.outputs.removed == 'true' }}
              env:
                  GH_TOKEN: ${{ github.token }}
              run: gh workflow run astro.yml --ref main -f publish_only=true || echo "::warning::Could not dispatch the deploy workflow."

            - name: Update preview comment
              uses: actions/github-script@v7
              with:
                  script: |
                      const marker = '<!-- pr-preview-comment -->';
                      const { owner, repo } = context.repo;
                      const issue_number = context.payload.pull_request.number;
                      const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
                      const existing = comments.find(c => c.body && c.body.includes(marker));
                      if (existing) {
                        const body = `${marker}\n### Site preview\n\nThe preview for this pull request has been removed because it was closed.`;
                        await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
                      }
